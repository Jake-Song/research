# Accelerate config for NATIVE FP8 training (torchao float8) on top of FSDP2.
#
# This is what makes the training side run in FP8. Async GRPO requires FSDP2
# (DeepSpeed ZeRO is not supported), and torchao float8 also runs on FSDP2,
# so the two compose cleanly.
#
# Hardware: requires FP8 tensor cores -> NVIDIA Hopper (H100/H200),
# Ada (L40/L40S/4090), or Blackwell (B200). Will error on Ampere (A100).
#
# Launch with:  accelerate launch --config_file accelerate_fp8.yaml train_async_grpo.py ...
#
# `num_processes` below = number of TRAINING GPUs (NOT counting the vLLM server GPU(s)).
# Edit it to match your training partition.

compute_environment: LOCAL_MACHINE
distributed_type: FSDP
machine_rank: 0
num_machines: 1
num_processes: 3            # <-- set to your number of *training* GPUs
mixed_precision: fp8        # drives torchao float8 mixed precision

# ---- FP8 (torchao / "ao" backend) ----
fp8_config:
  backend: AO
  # FP8 all-gather in FSDP2: shards/communicates params in fp8 -> less comms + memory.
  enable_fsdp_float8_all_gather: true
  # Pad K/N dims to multiples of 16 so the fp8 matmul kernels are happy on odd shapes.
  pad_inner_dim: true

# ---- FSDP2 ----
fsdp_config:
  fsdp_version: 2
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_offload_params: false
  fsdp_state_dict_type: SHARDED_STATE_DICT
  # CPU RAM efficient loading CANNOT be combined with torchao fp8 -> keep false.
  fsdp_cpu_ram_efficient_loading: false
  fsdp_reshard_after_forward: true

# ---- torch.compile (recommended for fp8: the gains mostly come from compiled fp8 kernels) ----
dynamo_config:
  dynamo_backend: INDUCTOR
  dynamo_use_regional_compilation: true

downcast_bf16: 'no'
enable_cpu_affinity: false
rdzv_backend: static
same_network: true
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
